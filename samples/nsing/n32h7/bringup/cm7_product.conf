# Product dual-core CM7 image.
# CM7 owns the system initialization and releases the independently linked
# CM4 image after POST_KERNEL initialization.
CONFIG_N32H78X_START_M4=y
CONFIG_N32H78X_DCMU_INIT=y
CONFIG_N32H78X_DCMU_TEST=n
CONFIG_N32H78X_DISABLE_WFI=y
CONFIG_N32H78X_CM4_SUPERVISOR=y
CONFIG_N32H78X_CM4_HEARTBEAT_TIMEOUT_CYCLES=3
