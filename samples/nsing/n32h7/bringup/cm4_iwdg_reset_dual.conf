# Controlled CM4 IWDG reset test.  The bring-up app stops feeding after
# several iterations when CONFIG_N32H7_IWDG_RESET_TEST is enabled.
CONFIG_N32H78X_CM4_WAIT_FOR_CM7=y
CONFIG_N32H78X_CM4_BOOT_TIMEOUT_LOOPS=100000000
CONFIG_N32H78X_START_M4=n
CONFIG_N32H78X_DCMU_INIT=n
CONFIG_N32H78X_DCMU_TEST=n
CONFIG_N32H78X_DISABLE_WFI=y
CONFIG_WATCHDOG=y
CONFIG_WDT_N32H7_IWDG=y
CONFIG_WDT_N32H7_WWDG=n
CONFIG_N32H7_IWDG_RESET_TEST=y
