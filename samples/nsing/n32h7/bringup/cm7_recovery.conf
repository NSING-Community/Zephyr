# Recovery image used while programming the independent CM4 Flash window.
# Keep the CM7 alive while the debugger halts it for the Flash loader.
CONFIG_WATCHDOG=n
CONFIG_WDT_N32H7_IWDG=n
CONFIG_WDT_N32H7_WWDG=n
CONFIG_N32H78X_START_M4=n
CONFIG_N32H78X_DCMU_INIT=n
CONFIG_N32H78X_DCMU_TEST=n
CONFIG_N32H78X_DISABLE_WFI=y
