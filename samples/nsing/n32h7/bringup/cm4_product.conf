# Product dual-core CM4 image.
# CM4 must wait until CM7 publishes the shared-memory READY state.
CONFIG_N32H78X_START_M4=n
CONFIG_N32H78X_CM4_WAIT_FOR_CM7=y
CONFIG_N32H78X_DCMU_INIT=y
CONFIG_N32H78X_DCMU_TEST=n
CONFIG_MBOX_N32H7_DCMU=n
CONFIG_N32H78X_DISABLE_WFI=y
