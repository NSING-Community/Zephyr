# DCMU smoke test counterpart for CM4.
CONFIG_N32H78X_CM4_WAIT_FOR_CM7=y
CONFIG_N32H78X_CM4_BOOT_TIMEOUT_LOOPS=100000000
CONFIG_N32H78X_START_M4=n
CONFIG_N32H78X_DCMU_INIT=y
CONFIG_N32H78X_DCMU_TEST=y
CONFIG_MBOX=y
# Both cores use the Zephyr MBOX API; there is one consumer per local DCMU
# receive FIFO and no direct-register consumer races the ISR.
CONFIG_MBOX_N32H7_DCMU=y
CONFIG_N32H78X_DISABLE_WFI=y
CONFIG_WATCHDOG=n
CONFIG_WDT_N32H7_IWDG=n
CONFIG_WDT_N32H7_WWDG=n
