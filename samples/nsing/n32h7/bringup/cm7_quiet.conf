# Cortex-M7 companion image for device testing a Cortex-M4 image that drives
# USART1/USART2. Both cores share the GPIO and pin control registers, so this
# image must not initialize the console (USART1 on PA9/PA10) or enable its RX
# echo interrupt while the Cortex-M4 uses those pins as the cross-over pair.
# Use together with cm7_product.conf; the Cortex-M4 image stays observable on
# USART3 through the external adapter.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_UART_INTERRUPT_DRIVEN=n
