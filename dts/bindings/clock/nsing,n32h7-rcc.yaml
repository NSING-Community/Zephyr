description: Nations Technologies N32H78x RCC clock controller

compatible: "nsing,n32h7-rcc"

include: [base.yaml, clock-controller.yaml]

properties:
  reg:
    required: true

  "#clock-cells":
    const: 1

  clock-frequency:
    type: int
    required: true
    description: SYSCLK in Hz at reset/SoC initialization.

clock-cells:
  - clkid
