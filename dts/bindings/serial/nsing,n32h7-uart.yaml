description: Nations N32H7 USART controller
compatible: "nsing,n32h7-uart"
include: [uart-controller.yaml, base.yaml]
properties:
  pinctrl-0:
    type: phandles
  pinctrl-names:
    type: string-array
  reg:
    required: true
  interrupts:
    required: true
  clocks:
    required: true
