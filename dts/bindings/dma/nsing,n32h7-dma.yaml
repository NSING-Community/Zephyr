description: Nations Technologies N32H7 DMA controller

compatible: "nsing,n32h7-dma"

include: [dma-controller.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  interrupts:
    required: true

  dma-channels:
    required: true

  nsing,mem2mem:
    type: boolean
    description: The DMA controller supports memory to memory transfer

  "#dma-cells":
    const: 3

dma-cells:
  - channel
  - request
  - config
