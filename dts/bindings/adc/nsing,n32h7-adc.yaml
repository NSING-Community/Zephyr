description: Nations Technologies N32H7 ADC

compatible: "nsing,n32h7-adc"

include: [adc-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  interrupts:
    required: true

  "#io-channel-cells":
    const: 1

  channels:
    type: int
    description: Number of external channels
    required: true

io-channel-cells:
  - input
