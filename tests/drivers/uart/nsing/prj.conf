CONFIG_ZTEST=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_CLOCK_CONTROL=y
CONFIG_PINCTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# The H78 UART test is flashed and started as a standalone CM4 image.  There
# is no companion CM7 image in this test setup to publish the shared-memory
# ready flag.
CONFIG_N32H78X_CM4_WAIT_FOR_CM7=n
