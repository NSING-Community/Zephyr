# The N32H7 watchdog drivers gate the peripheral clock through the RCC driver.
CONFIG_CLOCK_CONTROL=y
# The shared test only enables printk; the console itself has to be selected
# here or the test verdict is invisible on the serial port.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
